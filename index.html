<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Нитью — сайт в разработке</title>
  <meta name="description" content="Нитью — машинная вышивка. Сайт в разработке.">
  <meta name="theme-color" content="#f4f0e8">
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <style>
    :root{
      --bg:#f4f0e8;
      --ink:#111111;
      --muted:#777168;
      --line:rgba(17,17,17,.16);
      --card:rgba(255,255,255,.62);
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      min-height:100%;
    }

    body{
      font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
      background:
        radial-gradient(circle at 12% 18%, rgba(255,255,255,.72), transparent 24%),
        radial-gradient(circle at 85% 78%, rgba(255,255,255,.52), transparent 28%),
        var(--bg);
      color:var(--ink);
    }

    .site{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:28px;
    }

    .content{
      width:min(820px,100%);
    }

    .brand-row{
      display:flex;
      align-items:center;
      gap:22px;
      margin-bottom:38px;
    }

    .logo{
      width:92px;
      height:92px;
      flex:0 0 92px;
      display:block;
    }

    .brand-name{
      margin:0;
      font-size:clamp(34px,5vw,54px);
      line-height:.95;
      font-weight:800;
      letter-spacing:-.04em;
    }

    .brand-sub{
      margin-top:8px;
      color:var(--muted);
      font-size:13px;
      letter-spacing:.14em;
      text-transform:uppercase;
    }

    h1{
      margin:0;
      font-size:clamp(54px,8vw,96px);
      line-height:.92;
      letter-spacing:-.06em;
      font-weight:800;
      max-width:700px;
    }

    .sub{
      margin:26px 0 0;
      color:var(--muted);
      font-size:20px;
      line-height:1.55;
      max-width:700px;
    }

    .contacts{
      margin-top:50px;
      padding:28px 30px;
      border:1px solid var(--line);
      border-radius:26px;
      background:var(--card);
      box-shadow:0 18px 50px rgba(17,17,17,.08);
      width:min(680px,100%);
    }

    .contacts-title{
      margin:0 0 18px;
      font-size:16px;
      color:var(--muted);
      text-transform:uppercase;
      letter-spacing:.14em;
      font-weight:700;
    }

    .contact{
      display:block;
      color:var(--ink);
      text-decoration:none;
      font-size:clamp(26px,3.4vw,38px);
      line-height:1.18;
      font-weight:700;
      width:max-content;
      max-width:100%;
    }

    .contact + .contact{
      margin-top:18px;
    }

    .contact span{
      display:block;
      margin-bottom:6px;
      color:var(--muted);
      font-size:12px;
      font-weight:700;
      letter-spacing:.14em;
      text-transform:uppercase;
    }

    .footer{
      margin-top:34px;
      color:var(--muted);
      font-size:12px;
      letter-spacing:.08em;
      text-transform:uppercase;
    }

    @media (max-width:720px){
      .site{padding:22px}
      .brand-row{gap:16px;margin-bottom:30px}
      .logo{width:74px;height:74px;flex-basis:74px}
      .contacts{padding:22px 20px;margin-top:38px}
      .contact{font-size:clamp(22px,7vw,30px)}
    }
  </style>
</head>
<body>
  <main class="site">
    <div class="content">
      <div class="brand-row">
        <img src="logo.svg" alt="Логотип Нитью" class="logo">
        <div>
          <h2 class="brand-name">Нитью</h2>
          <div class="brand-sub">nityu.ru · машинная вышивка</div>
        </div>
      </div>

      <h1>Сайт<br>в разработке.</h1>

      <p class="sub">
        Мы готовим новый сайт. Пока он ещё не готов, вы можете связаться с нами напрямую.
      </p>

      <div class="contacts">
        <p class="contacts-title">Контакты для связи</p>

        <a class="contact" href="mailto:info@nityu.ru">
          <span>E-mail</span>
          info@nityu.ru
        </a>

        <a class="contact" href="https://t.me/nityu_ru" target="_blank" rel="noopener">
          <span>Telegram</span>
          @nityu_ru
        </a>
      </div>

    </div>
  </main>
</body>
</html>
